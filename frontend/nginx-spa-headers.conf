# Headers for the routes of the single page application. An add_header inside a
# location drops every add_header inherited from the server block, so the
# security headers have to be repeated here, next to the Cache-Control of the
# route. Without this file the app pages were served with none of them.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Link "<https://www.joulezeropoint.com$canonical_path>; rel=\"canonical\"" always;
