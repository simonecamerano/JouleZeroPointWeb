server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # News images, uploaded from the editorial dashboard and served by the backend
    # from its own volume. They used to live on Cloudinary, a third party that saw
    # the IP address of every visitor reading a news item.
    #
    # Only files with an image extension, and it has to be a regex: /news is also
    # a route of the single page application, so a prefix location would send the
    # news archive and every article to the backend, which answers 404 in JSON.
    # It happened on 2026-08-25, between one deploy and the next.
    #
    # Regex locations are evaluated in the order they appear, so this must stay
    # above the generic by-extension rule below, or that one would claim these
    # files and look for them among nginx's own static assets.
    location ~* ^/news/.+\.(?:png|jpe?g|gif|webp|svg|avif)$ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static assets: cache 1 year, immutable (hashed filenames from Vite)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Trailing slash: /regolamento/ answered 200 like /regolamento, and Google saw
    # two copies of the same page, each declaring itself canonical. One URL only,
    # without the slash, as in the sitemap. Relative Location header: TLS ends at
    # the Coolify proxy, an absolute redirect built here would point to http.
    location ~ ^/(.+)/$ {
        return 301 /$1$is_args$args;
    }

    # Routes of the single page application: index.html with status 200.
    # Keep this list in sync with src/router/index.ts. A route missing here is
    # not broken for visitors (the app renders it anyway), but it answers 404 to
    # crawlers and drops out of the index.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~ ^/(?:cards|come-iniziare|regolamento|login|register|deckbuilder|public-decks|news|storia|terminale-punto-zero|admin/news|profile|terms|code-of-conduct|privacy|contact|forgot-password)$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~ ^/(?:starter-decks|news|verify-email|reset-password)/[^/]+$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Everything else: real files (robots.txt, sitemap.xml, PDFs, service worker)
    # or a 404. Unknown paths used to get index.html with status 200, a copy of
    # the home page that Google indexed as a duplicate. Now they get the same
    # index.html (the app shows its not-found page) but with status 404.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # Proxy API requests to the backend service. ^~ keeps the regex locations
    # above (trailing slash, assets) from claiming API paths.
    location ^~ /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
